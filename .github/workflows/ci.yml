# One pipeline for every push and pull request to main:
#   1. Build and test on Node 20 and 22
#   2. CodeQL security scan (runs alongside the tests, and weekly on its own)
#   3. SonarQube analysis, once the tests pass
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '45 1 * * 3'   # weekly CodeQL scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Node ${{ matrix.node-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Next.js 16 needs Node 20.9 or newer, so Node 18 is left out.
        node-version: [20.x, 22.x]
    env:
      # next build loads the auth config; a throwaway secret is enough to build.
      AUTH_SECRET: ci-build-only
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  sonarqube:
    name: SonarQube analysis
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # lets SonarQube comment on pull requests
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Skip when SonarQube isn't set up yet
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == ''
        run: echo "::notice::Add the SONAR_TOKEN and SONAR_HOST_URL repository secrets to turn on SonarQube analysis."
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        with:
          fetch-depth: 0   # full history gives SonarQube accurate blame and new-code detection
      - name: Analyze with SonarQube
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=okeke-prince_Project_Tracker
            -Dsonar.exclusions=**/node_modules/**,**/.next/**
