# One pipeline for every push and pull request to main:
#   1. Build and test on Node 20 and 22
#   2. CodeQL security scan (runs alongside the tests, and weekly on its own)
#   3. SonarCloud analysis, once the tests pass
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '45 1 * * 3'   # weekly CodeQL scan
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (version in the comment) so a
# moved tag can't change what runs.

jobs:
  test:
    name: Build and test (Node ${{ matrix.node-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Next.js 16 needs Node 20.9 or newer, so Node 18 is left out.
        node-version: [20.x, 22.x]
    env:
      # next build loads the auth config; a throwaway secret is enough to build.
      AUTH_SECRET: ci-build-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      # Skip install scripts from dependencies, then build the one that needs it
      # (better-sqlite3 fetches its native SQLite binding during install).
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: npm test
      - run: npm run build

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  sonarcloud:
    name: SonarCloud analysis
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # lets SonarCloud comment on pull requests
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip when SonarCloud isn't set up yet
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::Add the SONAR_TOKEN repository secret to turn on SonarCloud analysis."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0   # full history gives SonarCloud accurate blame and new-code detection
      - name: Analyze with SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        # Project settings live in sonar-project.properties at the repo root.
